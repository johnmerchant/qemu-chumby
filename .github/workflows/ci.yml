# SPDX-License-Identifier: GPL-2.0-or-later
#
# qemu-system-arm with the chumby-classic machine, built with
# ./build --portable on each host it's meant for (Linux x86_64 and aarch64,
# macOS on Apple silicon) so that it runs with nothing installed: static on
# Linux, and linking only the system's libraries on macOS, as
# tests/runtime/check checks. Each is booted on tests/smoke/run's kernel of
# a few instructions (no firmware, no network); the macOS build again with
# Homebrew moved out of the way, and the Linux builds again on stock
# runners and in Alpine and NixOS containers, none of which have any of the
# build's packages.
#
# Each commit on main publishes its binaries as assets of one prerelease,
# `prebuilt`, so that others (neochumby's CI) can fetch the build of the
# exact commit they pin, without a token:
#
#   https://github.com/johnmerchant/qemu-chumby/releases/download/prebuilt/qemu-chumby-COMMIT-PLATFORM.tar.xz
#   ... and the same with .sha256 (its SHA-256, as sha256sum prints it)
#
# COMMIT is the full commit ID; PLATFORM is linux-x86_64, linux-aarch64 or
# macos-arm64. Each tarball holds qemu-system-arm, qemu-bundle/ beside it
# (the keymaps VNC loads), RUNTIME (what it needs to run, which is nothing,
# and what it links) and COPYING.
#
# For the Linux desktop, beside them on the same release, each with its
# .sha256:
#   qemu-chumby-COMMIT-ARCH.flatpak (`flatpak`): chumby-desktop, the app,
#     with its QEMU and sound (flatpak/), a single-file bundle; installed
#     in its builder's container and run headless on the smoke kernel.
#   qemu-chumby-COMMIT-DISTRO-VERSION-ARCH.deb or .rpm (`packages`): QEMU
#     with its GTK and SDL windows and sound, built on each distro against
#     its own libraries (packaging/); each installed in a clean container
#     of its distro and booted on tests/smoke/run.
# ARCH is x86_64 or aarch64. These build on main, by hand, and on pull
# requests that change what they're built from (`changes`).
#
# The release keeps the newest 100 commits' builds. Pull requests build and
# test, and publish nothing.
#
# The project's page, https://johnmerchant.github.io/qemu-chumby/, is made
# by site/build-site on every run (`site`) and deployed to GitHub Pages
# from main once `publish` has put the builds it links on the release
# (`pages`).
#
# Daily (schedule), and when run by hand on main, `qemu-sync` keeps the
# pinned QEMU release in step with upstream's (./qemu-sync): a newer point
# release of the series, or a newer series, is proposed as a pull request
# on qemu-bump/point or qemu-bump/series, whose CI says whether the
# patches still apply and build. On schedule, only it runs. Pull requests
# run its dry run (`qemu-sync-plan`), which checks the tarball signature
# verification and prints what it would do.
#
# Run by hand (workflow_dispatch), it builds COMMIT (default: the branch's
# head) with this workflow, and with `publish` set, publishes it, but only
# if COMMIT is on main: a build for a commit that main had before this
# workflow existed, say.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to build (default the branch's head)
        required: false
        default: ''
      publish:
        description: Publish it (only a commit on main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ inputs.commit }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The build's own sources come from COMMIT; tests/ and chumby_machine.py,
  # which test it, from this workflow's commit (in .ci/).
  COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in Alpine (musl), whose -static packages make
          # a static binary (see ./build): started with docker run rather
          # than as the job's container, since actions don't run in Alpine
          # on aarch64.
          - platform: linux-x86_64
            runner: ubuntu-24.04
            builder: alpine:3.22
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            builder: alpine:3.22
          # Homebrew gives only the build's tools: ./build --portable
          # builds glib, pixman and libpng itself and looks nowhere else.
          - platform: macos-arm64
            runner: macos-15
            builder: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Packages
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: .ci

      - name: Restore the tarballs
        uses: actions/cache@v4
        with:
          path: |
            out/*.tar.xz
            out/*.tar.gz
          key: tarballs-${{ hashFiles('qemu-release', 'portable-deps') }}

      # The binary and its keymaps, keyed by everything they're built from:
      # a hit skips the build.
      - name: Restore the build
        id: cache
        uses: actions/cache@v4
        with:
          path: out/portable
          key: qemu-portable-${{ matrix.platform }}-${{ matrix.builder || matrix.runner }}-${{ hashFiles('build', 'qemu-release', 'portable-deps', 'patches/*.patch') }}

      # Into out/: ./build's default directory, build/ beside it, is the
      # script itself.
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e HOST_IDS="$(id -u):$(id -g)" \
            ${{ matrix.builder }} sh -ec '
              apk add -q --no-cache build-base python3 ninja pkgconf linux-headers \
                curl xz patch git glib-dev glib-static pixman-dev pixman-static \
                libpng-dev libpng-static zlib-dev zlib-static pcre2-dev pcre2-static
              trap "chown -R $HOST_IDS out" EXIT
              ./build --portable out'
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: ./build --portable out

      - name: Needs nothing installed
        run: .ci/tests/runtime/check out/portable/qemu-system-arm

      - name: Smoke test
        run: python3 .ci/tests/smoke/run out/portable/qemu-system-arm

      - name: Package
        id: package
        run: |
          name=qemu-chumby-$COMMIT-${{ matrix.platform }}
          . ./qemu-release
          mkdir -p "dist/$name"
          cp -R out/portable/. "dist/$name/"
          cp COPYING "dist/$name/"
          # On Linux, without its debugging symbols, which are most of it.
          # (On macOS the build signs it, and stripping would undo that.)
          if [ "$RUNNER_OS" = Linux ]; then
            strip "dist/$name/qemu-system-arm"
          fi
          "dist/$name/qemu-system-arm" -machine help | grep '^chumby-classic '
          {
            echo "qemu-system-arm with the chumby-classic machine"
            echo
            echo "qemu-chumby commit: $COMMIT"
            echo "  https://github.com/johnmerchant/qemu-chumby/tree/$COMMIT"
            echo "QEMU release: $version ($url), with that commit's patches/"
            echo "Platform: ${{ matrix.platform }}, built on ${{ matrix.builder || matrix.runner }}"
            echo
            echo "The source is the commit above: ./build --portable there rebuilds"
            echo "this binary. GPL-2.0-or-later (COPYING)."
            echo
            if [ "$RUNNER_OS" = Linux ]; then
              echo "Needs nothing installed. A static executable, with musl, glib,"
              echo "pcre2, pixman, libpng and zlib linked in: it runs on any Linux on"
              echo "$(uname -m), whatever its libc or layout (Ubuntu, Debian, Fedora,"
              echo "Alpine, NixOS...)."
              echo
              echo "Headless: -display none, VNC (a unix socket or TCP), QMP, PNG"
              echo "screendumps, usb-kbd and usb-storage. No window and no sound"
              echo "(-audiodev none or wav only); for those, ./build or Nix."
            else
              echo "Needs nothing installed: macOS 15 or later on Apple silicon. glib,"
              echo "pixman and libpng are linked in, and it links only the system's"
              echo "libraries and frameworks. The Cocoa window, CoreAudio, VNC (a unix"
              echo "socket or TCP), QMP and PNG screendumps are built in."
              echo
              echo "Signed ad hoc. curl and gh leave what they download unquarantined;"
              echo "if a browser quarantined the tarball, clear that before running:"
              echo "  xattr -dr com.apple.quarantine qemu-chumby-*"
            fi
            echo
            echo "What it links (tests/runtime/check):"
            .ci/tests/runtime/check "dist/$name/qemu-system-arm"
          } > "dist/$name/RUNTIME"
          cat "dist/$name/RUNTIME"
          tar -C dist -cJf "dist/$name.tar.xz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.xz" > "$name.tar.xz.sha256"
          else
            shasum -a 256 "$name.tar.xz" > "$name.tar.xz.sha256"
          fi
          cat "$name.tar.xz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The tarball as a Mac without Homebrew has it: unpacked and booted
      # with /opt/homebrew moved away.
      - name: Without Homebrew
        if: runner.os == 'macOS'
        run: |
          mkdir "$RUNNER_TEMP/mac"
          tar -C "$RUNNER_TEMP/mac" -xJf "dist/${{ steps.package.outputs.name }}.tar.xz"
          q=$(echo "$RUNNER_TEMP"/mac/qemu-chumby-*/qemu-system-arm)
          sudo mv /opt/homebrew /opt/homebrew.away
          trap 'sudo mv /opt/homebrew.away /opt/homebrew' EXIT
          "$q" -M help | grep '^chumby-classic '
          /usr/bin/python3 .ci/tests/smoke/run "$q"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.xz
            dist/${{ steps.package.outputs.name }}.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7

  # The Linux tarballs on GitHub's stock runners, as another project's CI
  # would use them, and in Alpine (musl) and NixOS (no /lib or /usr/lib)
  # containers: checked, unpacked and booted with no packages installed.
  stock:
    name: Run on a stock runner (${{ matrix.runner }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ runner.temp }}/dl
      - name: Unpack
        run: |
          cd "$RUNNER_TEMP/dl"
          sha256sum -c ./*.sha256
          tar xJf ./*.tar.xz
          q=$(echo "$RUNNER_TEMP"/dl/qemu-chumby-*/qemu-system-arm)
          "$GITHUB_WORKSPACE/tests/runtime/check" "$q"
          "$q" -M help | grep '^chumby-classic '
          echo "QEMU=$q" >> "$GITHUB_ENV"
      - name: Smoke test
        run: python3 tests/smoke/run "$QEMU"
      # The smoke test needs Python, which the NixOS image hasn't: there,
      # QEMU boots the same kernel and its console is read.
      - name: In Alpine and NixOS
        run: |
          mkdir "$RUNNER_TEMP/k"
          python3 tests/smoke/run --kernel "$RUNNER_TEMP/k/smoke.bin"
          for image in alpine:3.22 nixos/nix:latest; do
            echo "== $image"
            docker run --rm --network none -v "$(dirname "$QEMU"):/q:ro" \
              -v "$RUNNER_TEMP/k:/k:ro" "$image" sh -c '
                /q/qemu-system-arm -M help | grep "^chumby-classic "
                timeout 20 /q/qemu-system-arm -M chumby-classic -kernel /k/smoke.bin \
                  -nic none -display none -monitor none -serial stdio
                true' > "$RUNNER_TEMP/console" 2>&1
            cat "$RUNNER_TEMP/console"
            grep -q '^chumby-classic ' "$RUNNER_TEMP/console"
            grep -q 'chumby-classic: smoke kernel up' "$RUNNER_TEMP/console"
          done

  # Whether to build the Flatpak and the distro packages: on main and by
  # hand (if COMMIT has packaging/), and on pull requests that change what
  # they're built from or test with.
  changes:
    name: What changed
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.c.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ ! -x packaging/build-package ]; then
            linux=false
          elif [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            linux=true
          elif git diff --name-only "$BASE...HEAD" | tee /dev/stderr | grep -qE \
              '^(build|qemu-release|patches/|packaging/|flatpak/|frontend/linux/|chumby-machine|chumby-ctl|chumby_machine\.py|tests/|\.github/workflows/ci\.yml$)'; then
            linux=true
          else
            linux=false
          fi
          echo "linux=$linux" | tee -a "$GITHUB_OUTPUT"

  # The distro packages: packaging/build-package on each distro, in a
  # container of it, then packaging/test-package in a clean one.
  packages:
    name: Package (${{ matrix.distro }}, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The distros, here only: Debian's stable release, Ubuntu's
        # current LTS and its newest release, and Fedora's newest two.
        # Bump them as they release (Ubuntu each April and October, Fedora
        # about then too, Debian every two years or so): the image tag is
        # all that changes, and each package's name follows from it.
        distro: ['debian:13', 'ubuntu:26.04', 'ubuntu:26.10', 'fedora:44', 'fedora:43']
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - name: Its name
        id: name
        run: |
          d=${{ matrix.distro }}
          case $d in fedora:*) ext=rpm ;; *) ext=deb ;; esac
          echo "name=qemu-chumby-$COMMIT-${d%%:*}-${d#*:}-${{ matrix.arch }}.$ext" >> "$GITHUB_OUTPUT"
          echo "slug=${d%%:*}-${d#*:}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
      - name: Restore the tarball
        uses: actions/cache@v4
        with:
          path: out/*.tar.xz
          key: qemu-tarball-${{ hashFiles('qemu-release') }}
      # The built tree, keyed by the distro and what it's built from: a hit
      # skips the build (the package and its dependencies are still made).
      - name: Restore the build
        uses: actions/cache@v4
        with:
          path: out/package
          key: qemu-package-${{ steps.name.outputs.slug }}-${{ hashFiles('build', 'qemu-release', 'patches/*.patch', 'chumby-machine', 'chumby-ctl', 'chumby_machine.py', 'README.md') }}
      - name: Build
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e HOST_IDS="$(id -u):$(id -g)" \
            "docker.io/library/${{ matrix.distro }}" sh -ec '
              trap "chown -R $HOST_IDS out" EXIT
              packaging/build-package --reuse'
          mkdir dist
          cp out/dist/*.* "dist/${{ steps.name.outputs.name }}"
          cd dist
          sha256sum ./*.* | sed 's| \./| |' > "${{ steps.name.outputs.name }}.sha256"
          cat ./*.sha256
          ls -l
      - name: Install and test in a clean container
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w "docker.io/library/${{ matrix.distro }}" \
            packaging/test-package "dist/${{ steps.name.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.name.outputs.slug }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The Flatpak (flatpak/build), in Flathub's builder image for the KDE
  # runtime the manifest names, then installed there and run: QEMU's
  # machine and sound backends, and the app itself, headless (offscreen),
  # booting the smoke kernel through its test hook.
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    env:
      FLATPAK_INSTALLATION: --system
      NAME: qemu-chumby-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-${{ matrix.arch }}.flatpak
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      # flatpak-builder's downloads, ccache and built modules: an unchanged
      # QEMU module is reused.
      - name: Restore the builder's state
        uses: actions/cache@v4
        with:
          path: flatpak/.build/state
          key: flatpak-${{ matrix.arch }}-${{ hashFiles('flatpak/build', 'flatpak/*.yml', 'flatpak/*.json', 'flatpak/*.xml', 'patches/*.patch', 'frontend/linux/**') }}
          restore-keys: flatpak-${{ matrix.arch }}-
      - name: Build
        run: |
          flatpak/build "dist/$NAME"
          cd dist
          sha256sum "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"
      - name: Install and run
        run: |
          id=io.github.johnmerchant.QemuChumby
          flatpak install --system -y --noninteractive "dist/$NAME"
          flatpak info "$id"
          q() { flatpak run --command=qemu-system-arm "$id" "$@"; }
          q -machine help | grep '^chumby-classic '
          q -audiodev help | tee "$RUNNER_TEMP/audio"
          grep -qx pa "$RUNNER_TEMP/audio"
          grep -qx pipewire "$RUNNER_TEMP/audio"
          # The app, headless, on the smoke kernel: its test hook resets
          # the machine once the app is on its console (the kernel says
          # its line once, at boot), waits for the line, grabs the window
          # and quits.
          t=$RUNNER_TEMP/app
          mkdir -p "$t"
          python3 tests/smoke/run --kernel "$t/smoke.bin"
          printf '%s\n' 'wait 2000' 'call reset' 'waitfor smoke kernel up 60' \
            "grab $t/window.png" "log $t/console.log" quit > "$t/test"
          export XDG_RUNTIME_DIR=$t/run
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          timeout 180 flatpak run --filesystem="$t" --env=QT_QPA_PLATFORM=offscreen \
            --env=CHUMBY_DESKTOP_TEST="$t/test" "$id" --kernel "$t/smoke.bin" --audio none \
            2>&1 | tee "$t/out"
          grep -q 'test: waitfor "smoke kernel up": seen' "$t/out"
          grep -q "test: grab $t/window.png: saved" "$t/out"
          grep -q 'smoke kernel up' "$t/console.log"
          test -s "$t/window.png"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            dist/${{ env.NAME }}
            dist/${{ env.NAME }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [build, stock, packages, flatpak]
    # The Flatpak and the packages are skipped when COMMIT has no
    # packaging/ (a build by hand of an older commit).
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && needs.build.result == 'success'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time: each creates the release if it's missing and prunes it.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: prebuilt
      KEEP: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Only commits on main
        run: |
          git cat-file -e "$COMMIT^{commit}"
          git merge-base --is-ancestor "$COMMIT" origin/main
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
          merge-multiple: true
      - name: Upload
        run: |
          cd "$RUNNER_TEMP/dl"
          ls -l
          sha256sum -c ./*.sha256
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --target main \
              --title 'Prebuilt qemu-system-arm' \
              --notes "qemu-system-arm with the chumby-classic machine, built by CI for each commit on main: qemu-chumby-COMMIT-PLATFORM.tar.xz (COMMIT the full commit ID; PLATFORM linux-x86_64, linux-aarch64 or macos-arm64) and its .sha256. Each tarball's RUNTIME says what it needs to run. For the Linux desktop: qemu-chumby-COMMIT-ARCH.flatpak (the chumby-desktop app) and the distro packages qemu-chumby-COMMIT-DISTRO-VERSION-ARCH.deb or .rpm. The newest $KEEP commits' builds are kept. The source of each is its commit (./build); GPL-2.0-or-later."
          fi
          gh release upload "$TAG" $(ls ./*.tar.xz ./*.flatpak ./*.deb ./*.rpm 2>/dev/null) ./*.sha256 --clobber
      # Assets of all but the newest KEEP commits, by upload time.
      - name: Prune
        run: |
          release=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)
          gh api --paginate "repos/$GH_REPO/releases/$release/assets?per_page=100" \
            --jq '.[] | [.created_at, .id, .name] | @tsv' | sort -r > "$RUNNER_TEMP/assets"
          keep=$(cut -f3 "$RUNNER_TEMP/assets" | sed -n 's/^qemu-chumby-\([0-9a-f]\{40\}\)-.*/\1/p' | awk '!seen[$0]++' | head -n "$KEEP")
          while IFS="$(printf '\t')" read -r _ id name; do
            c=$(echo "$name" | sed -n 's/^qemu-chumby-\([0-9a-f]\{40\}\)-.*/\1/p')
            if [ -n "$c" ] && ! echo "$keep" | grep -qx "$c"; then
              echo "deleting $name"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
            fi
          done < "$RUNNER_TEMP/assets"

  # The project's page (site/build-site), from this commit's README.md and
  # patches/ and the builds' .sha256 files: built on every run as a check,
  # and uploaded as the Pages artifact that `pages` deploys.
  site:
    name: Site
    needs: [build, packages, flatpak]
    if: >-
      always() && needs.build.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
          merge-multiple: true
      - name: Build
        run: python3 -I site/build-site --commit "$COMMIT" --sha256 "$RUNNER_TEMP/dl" --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # On main, once `publish` has put this commit's builds on the release:
  # the downloads the page links are checked, then it is deployed to
  # https://johnmerchant.github.io/qemu-chumby/.
  pages:
    name: Deploy the site
    needs: [site, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Its downloads are there
        run: |
          mkdir "$RUNNER_TEMP/site"
          tar -C "$RUNNER_TEMP/site" -xf "$RUNNER_TEMP/pages/artifact.tar"
          jq -r '.[] | .url, .sha256_url' "$RUNNER_TEMP/site/downloads.json" > "$RUNNER_TEMP/urls"
          test -s "$RUNNER_TEMP/urls"
          while read -r url; do
            echo "$url"
            curl -fsSIL -o /dev/null --retry 3 "$url"
          done < "$RUNNER_TEMP/urls"
      - uses: actions/deploy-pages@v5
        id: deploy

  # ./qemu-sync --self-test: the pinned release's tarball verifies with
  # QEMU's release key and a tampered copy doesn't; then the plan, from
  # upstream's releases as they are today, with nothing pushed.
  qemu-sync-plan:
    name: QEMU sync (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Signature checks
        run: python3 -I ./qemu-sync --self-test
      - name: Plan
        run: python3 -I ./qemu-sync --dry-run

  # Opens or updates the bump pull requests (see ./qemu-sync), and runs
  # CI on their branches, since what GITHUB_TOKEN pushes starts no
  # workflow. Never merges or approves.
  qemu-sync:
    name: QEMU sync
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: qemu-sync
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync
        run: python3 -I ./qemu-sync
