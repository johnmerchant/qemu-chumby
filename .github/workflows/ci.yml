# SPDX-License-Identifier: GPL-2.0-or-later
#
# qemu-system-arm with the chumby-classic machine, built with
# ./build --portable on each host it's meant for (Linux x86_64 and aarch64,
# macOS on Apple silicon) so that it runs with nothing installed: static on
# Linux, and linking only the system's libraries on macOS, as
# tests/runtime/check checks. Each is booted on tests/smoke/run's kernel of
# a few instructions (no firmware, no network); the macOS build again with
# Homebrew moved out of the way, and the Linux builds again on stock
# runners and in Alpine and NixOS containers, none of which have any of the
# build's packages.
#
# Each commit on main publishes its binaries as assets of one prerelease,
# `prebuilt`, so that others (neochumby's CI) can fetch the build of the
# exact commit they pin, without a token:
#
#   https://github.com/johnmerchant/qemu-chumby/releases/download/prebuilt/qemu-chumby-COMMIT-PLATFORM.tar.xz
#   ... and the same with .sha256 (its SHA-256, as sha256sum prints it)
#
# COMMIT is the full commit ID; PLATFORM is linux-x86_64, linux-aarch64 or
# macos-arm64. Each tarball holds qemu-system-arm, RUNTIME (what it needs
# to run, which is nothing, and what it links) and COPYING. The release
# keeps the newest 100 commits' builds. Pull requests build and test, and
# publish nothing.
#
# Run by hand (workflow_dispatch), it builds COMMIT (default: the branch's
# head) with this workflow, and with `publish` set, publishes it, but only
# if COMMIT is on main: a build for a commit that main had before this
# workflow existed, say.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to build (default the branch's head)
        required: false
        default: ''
      publish:
        description: Publish it (only a commit on main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ inputs.commit }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The build's own sources come from COMMIT; tests/ and chumby_machine.py,
  # which test it, from this workflow's commit (in .ci/).
  COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in Alpine (musl), whose -static packages make
          # a static binary (see ./build): started with docker run rather
          # than as the job's container, since actions don't run in Alpine
          # on aarch64.
          - platform: linux-x86_64
            runner: ubuntu-24.04
            builder: alpine:3.22
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            builder: alpine:3.22
          # Homebrew gives only the build's tools: ./build --portable
          # builds glib, pixman and libpng itself and looks nowhere else.
          - platform: macos-arm64
            runner: macos-15
            builder: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Packages
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: .ci

      - name: Restore the tarballs
        uses: actions/cache@v4
        with:
          path: |
            out/*.tar.xz
            out/*.tar.gz
          key: tarballs-${{ hashFiles('qemu-release', 'portable-deps') }}

      # The binary, keyed by everything it's built from: a hit skips the
      # build.
      - name: Restore the build
        id: cache
        uses: actions/cache@v4
        with:
          path: out/obj/qemu-system-arm
          key: qemu-portable-${{ matrix.platform }}-${{ matrix.builder || matrix.runner }}-${{ hashFiles('build', 'qemu-release', 'portable-deps', 'patches/*.patch') }}

      # Into out/: ./build's default directory, build/ beside it, is the
      # script itself.
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e HOST_IDS="$(id -u):$(id -g)" \
            ${{ matrix.builder }} sh -ec '
              apk add -q --no-cache build-base python3 ninja pkgconf linux-headers \
                curl xz patch git glib-dev glib-static pixman-dev pixman-static \
                libpng-dev libpng-static zlib-dev zlib-static
              trap "chown -R $HOST_IDS out" EXIT
              ./build --portable out'
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: ./build --portable out

      - name: Needs nothing installed
        run: .ci/tests/runtime/check out/obj/qemu-system-arm

      - name: Smoke test
        run: python3 .ci/tests/smoke/run out/obj/qemu-system-arm

      - name: Package
        id: package
        run: |
          name=qemu-chumby-$COMMIT-${{ matrix.platform }}
          . ./qemu-release
          mkdir -p "dist/$name"
          cp out/obj/qemu-system-arm COPYING "dist/$name/"
          # On Linux, without its debugging symbols, which are most of it.
          # (On macOS the build signs it, and stripping would undo that.)
          if [ "$RUNNER_OS" = Linux ]; then
            strip "dist/$name/qemu-system-arm"
          fi
          "dist/$name/qemu-system-arm" -machine help | grep '^chumby-classic '
          {
            echo "qemu-system-arm with the chumby-classic machine"
            echo
            echo "qemu-chumby commit: $COMMIT"
            echo "  https://github.com/johnmerchant/qemu-chumby/tree/$COMMIT"
            echo "QEMU release: $version ($url), with that commit's patches/"
            echo "Platform: ${{ matrix.platform }}, built on ${{ matrix.builder || matrix.runner }}"
            echo
            echo "The source is the commit above: ./build --portable there rebuilds"
            echo "this binary. GPL-2.0-or-later (COPYING)."
            echo
            if [ "$RUNNER_OS" = Linux ]; then
              echo "Needs nothing installed. A static executable, with musl, glib,"
              echo "pixman, libpng and zlib linked in: it runs on any ${{ matrix.platform }}"
              echo "Linux, whatever its libc or layout (Ubuntu, Debian, Fedora, Alpine,"
              echo "NixOS...)."
              echo
              echo "Headless: -display none, VNC (a unix socket or TCP), QMP, PNG"
              echo "screendumps, usb-kbd and usb-storage. No window and no sound"
              echo "(-audiodev none or wav only); for those, ./build or Nix."
            else
              echo "Needs nothing installed: macOS 15 or later on Apple silicon. glib,"
              echo "pixman and libpng are linked in, and it links only the system's"
              echo "libraries and frameworks. The Cocoa window, CoreAudio, VNC (a unix"
              echo "socket or TCP), QMP and PNG screendumps are built in."
              echo
              echo "Signed ad hoc. curl and gh leave what they download unquarantined;"
              echo "if a browser quarantined the tarball, clear that before running:"
              echo "  xattr -dr com.apple.quarantine qemu-chumby-*"
            fi
            echo
            echo "What it links (tests/runtime/check):"
            .ci/tests/runtime/check "dist/$name/qemu-system-arm"
          } > "dist/$name/RUNTIME"
          cat "dist/$name/RUNTIME"
          tar -C dist -cJf "dist/$name.tar.xz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.xz" > "$name.tar.xz.sha256"
          else
            shasum -a 256 "$name.tar.xz" > "$name.tar.xz.sha256"
          fi
          cat "$name.tar.xz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The tarball as a Mac without Homebrew has it: unpacked and booted
      # with /opt/homebrew moved away.
      - name: Without Homebrew
        if: runner.os == 'macOS'
        run: |
          mkdir "$RUNNER_TEMP/mac"
          tar -C "$RUNNER_TEMP/mac" -xJf "dist/${{ steps.package.outputs.name }}.tar.xz"
          q=$(echo "$RUNNER_TEMP"/mac/qemu-chumby-*/qemu-system-arm)
          sudo mv /opt/homebrew /opt/homebrew.away
          trap 'sudo mv /opt/homebrew.away /opt/homebrew' EXIT
          "$q" -M help | grep '^chumby-classic '
          /usr/bin/python3 .ci/tests/smoke/run "$q"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.xz
            dist/${{ steps.package.outputs.name }}.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7

  # The Linux tarballs on GitHub's stock runners, as another project's CI
  # would use them, and in Alpine (musl) and NixOS (no /lib or /usr/lib)
  # containers: checked, unpacked and booted with no packages installed.
  stock:
    name: Run on a stock runner (${{ matrix.runner }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ runner.temp }}/dl
      - name: Unpack
        run: |
          cd "$RUNNER_TEMP/dl"
          sha256sum -c ./*.sha256
          tar xJf ./*.tar.xz
          q=$(echo "$RUNNER_TEMP"/dl/qemu-chumby-*/qemu-system-arm)
          "$GITHUB_WORKSPACE/tests/runtime/check" "$q"
          "$q" -M help | grep '^chumby-classic '
          echo "QEMU=$q" >> "$GITHUB_ENV"
      - name: Smoke test
        run: python3 tests/smoke/run "$QEMU"
      # The smoke test needs Python, which the NixOS image hasn't: there,
      # QEMU boots the same kernel and its console is read.
      - name: In Alpine and NixOS
        run: |
          mkdir "$RUNNER_TEMP/k"
          python3 tests/smoke/run --kernel "$RUNNER_TEMP/k/smoke.bin"
          for image in alpine:3.22 nixos/nix:latest; do
            echo "== $image"
            docker run --rm --network none -v "$(dirname "$QEMU"):/q:ro" \
              -v "$RUNNER_TEMP/k:/k:ro" "$image" sh -c '
                /q/qemu-system-arm -M help | grep "^chumby-classic "
                timeout 20 /q/qemu-system-arm -M chumby-classic -kernel /k/smoke.bin \
                  -nic none -display none -monitor none -serial stdio
                true' > "$RUNNER_TEMP/console" 2>&1
            cat "$RUNNER_TEMP/console"
            grep -q '^chumby-classic ' "$RUNNER_TEMP/console"
            grep -q 'chumby-classic: smoke kernel up' "$RUNNER_TEMP/console"
          done

  publish:
    name: Publish
    needs: [build, stock]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time: each creates the release if it's missing and prunes it.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: prebuilt
      KEEP: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Only commits on main
        run: |
          git cat-file -e "$COMMIT^{commit}"
          git merge-base --is-ancestor "$COMMIT" origin/main
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dl
          merge-multiple: true
      - name: Upload
        run: |
          cd "$RUNNER_TEMP/dl"
          ls -l
          sha256sum -c ./*.sha256
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --target main \
              --title 'Prebuilt qemu-system-arm' \
              --notes "qemu-system-arm with the chumby-classic machine, built by CI for each commit on main: qemu-chumby-COMMIT-PLATFORM.tar.xz (COMMIT the full commit ID; PLATFORM linux-x86_64, linux-aarch64 or macos-arm64) and its .sha256. Each tarball's RUNTIME says what it needs to run. The newest $KEEP commits' builds are kept. The source of each is its commit (./build); GPL-2.0-or-later."
          fi
          gh release upload "$TAG" ./*.tar.xz ./*.sha256 --clobber
      # Assets of all but the newest KEEP commits, by upload time.
      - name: Prune
        run: |
          release=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)
          gh api --paginate "repos/$GH_REPO/releases/$release/assets?per_page=100" \
            --jq '.[] | [.created_at, .id, .name] | @tsv' | sort -r > "$RUNNER_TEMP/assets"
          keep=$(cut -f3 "$RUNNER_TEMP/assets" | sed -n 's/^qemu-chumby-\([0-9a-f]\{40\}\)-.*/\1/p' | awk '!seen[$0]++' | head -n "$KEEP")
          while IFS="$(printf '\t')" read -r _ id name; do
            c=$(echo "$name" | sed -n 's/^qemu-chumby-\([0-9a-f]\{40\}\)-.*/\1/p')
            if [ -n "$c" ] && ! echo "$keep" | grep -qx "$c"; then
              echo "deleting $name"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
            fi
          done < "$RUNNER_TEMP/assets"
